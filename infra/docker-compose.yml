# Local dev infra only (docs/02 §2.9 — production runs on managed Postgres/Redis, not this compose file).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teacheros
      POSTGRES_PASSWORD: teacheros
      POSTGRES_DB: teacheros
    # Host port 5433, not 5432 — a locally-installed native Postgres Windows service binding
    # 0.0.0.0:5432 first is a common dev-machine collision (hit during this project's own setup:
    # connections silently reached the native service instead of this container, failing auth
    # against credentials that only exist here). The container's own internal port stays 5432.
    ports:
      - "5433:5432"
    volumes:
      - teacheros_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  teacheros_pg_data:
